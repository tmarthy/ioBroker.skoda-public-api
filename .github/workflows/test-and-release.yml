name: Test and Release

# Laeuft bei jedem Push und Pull Request sowie bei Versions-Tags.
#
# Die vollstaendige Plattformmatrix ist eine Veroeffentlichungsanforderung des
# ioBroker-Repository-Checkers und laeuft deshalb bei Pushes und Pull Requests.
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
    # Reine Dokumentationsaenderungen brauchen keinen Testlauf.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  pull_request: {}
  workflow_dispatch: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest
    # Die Obergrenze beendet einen haengenden Job deutlich vor dem GitHub-Standard
    # von sechs Stunden.
    timeout-minutes: 15

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Testet den Adapter auf allen unterstuetzten Node-Versionen.
  #
  # Alle drei vom ioBroker-Repository-Checker verlangten Betriebssysteme.
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    # Erst pruefen, dann testen: Wenn Lint oder Typpruefung scheitern, muessen die
    # teuren Testlaeufe gar nicht erst starten.
    needs: check-and-lint

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

  # Publishes tagged releases through npm Trusted Publishing and creates a GitHub release.
  deploy:
    needs: [check-and-lint, adapter-tests]

    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
